name: AI Content Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'نوع المحتوى'
        required: false
        default: 'random'
        type: choice
        options:
          - random
          - book_summary
          - article
          - story
          - facts
          - tips
          - news
          - philosophy
          - history
          - science
          - psychology
      book_name:
        description: 'اسم الكتاب (للملخصات فقط)'
        required: false
        default: ''
        type: string
      custom_topic:
        description: 'موضوع مخصص'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-content-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Content Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE || 'ar' }}
          CONTENT_TOPICS: ${{ vars.CONTENT_TOPICS }}
          CONTENT_STYLE: ${{ vars.CONTENT_STYLE || 'احترافي، مفيد، واضح' }}
          CONTENT_AUDIENCE: ${{ vars.CONTENT_AUDIENCE || 'الجمهور العربي' }}
          DUPLICATE_THRESHOLD: ${{ vars.DUPLICATE_THRESHOLD || '0.78' }}
          MAX_GENERATION_ATTEMPTS: ${{ vars.MAX_GENERATION_ATTEMPTS || '6' }}
          MEMORY_CONTEXT_LIMIT: ${{ vars.MEMORY_CONTEXT_LIMIT || '100' }}
          MAX_HASHTAGS: ${{ vars.MAX_HASHTAGS || '5' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          PUBLISH_HOURS: ${{ vars.PUBLISH_HOURS || '' }}
          PUBLISH_DAYS: ${{ vars.PUBLISH_DAYS || '' }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type || 'random' }}
          BOOK_NAME: ${{ github.event.inputs.book_name || '' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
        run: |
          python main.py

      - name: Upload database as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-database
          path: data/content.db
          retention-days: 7
          overwrite: true
