name: AI Content Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'نوع المحتوى'
        required: false
        default: 'random'
        type: choice
        options:
          - random
          - book_summary
          - article
          - story
          - facts
          - tips
          - news
          - philosophy
          - history
          - science
          - psychology
      book_name:
        description: 'اسم الكتاب'
        required: false
        default: ''
        type: string
      custom_topic:
        description: 'موضوع مخصص'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-content-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Content Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type || 'random' }}
          BOOK_NAME: ${{ github.event.inputs.book_name || '' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
        run: |
          python main.py

      - name: Save post to JSON
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from datetime import datetime
          
          # قراءة المنشور الأخير من قاعدة البيانات
          posts_file = 'docs/posts.json'
          
          # تحميل المنشورات الموجودة
          if os.path.exists(posts_file):
              with open(posts_file, 'r', encoding='utf-8') as f:
                  posts = json.load(f)
          else:
              posts = []
          
          # إضافة المنشور الجديد (من آخر run)
          new_post = {
              "id": len(posts) + 1,
              "title": "منشور جديد",
              "content": "تم نشر محتوى جديد",
              "type": os.getenv("CONTENT_TYPE", "random"),
              "date": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              "url": f"https://github.com/{os.getenv('GITHUB_REPOSITORY', 'ablove584-sketch/ai-content-agent')}/actions/runs/{os.getenv('GITHUB_RUN_ID', 'unknown')}"
          }
          
          posts.insert(0, new_post)
          
          # حفظ آخر 50 منشور فقط
          posts = posts[:50]
          
          with open(posts_file, 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          
          print(f"Saved {len(posts)} posts to {posts_file}")
          PYEOF

      - name: Commit and push posts.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/posts.json
          git commit -m "Update posts list" || echo "No changes"
          git push

      - name: Upload database as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-database
          path: data/content.db
          retention-days: 7
          overwrite: true
