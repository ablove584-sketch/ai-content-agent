<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشوراتي 📚</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 10px; }
        .subtitle { color: #666; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.9; }
        
        .post-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .post-card:hover { transform: translateY(-5px); }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .post-type {
            background: #e7f3ff;
            color: #0066cc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .post-date {
            color: #999;
            font-size: 12px;
        }
        .post-title {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .post-content {
            color: #666;
            line-height: 1.8;
            font-size: 15px;
        }
        .post-link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .post-link:hover { text-decoration: underline; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .empty {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 منشوراتي</h1>
            <p class="subtitle">منشورات يتم توليدها ونشرها تلقائياً بالذكاء الاصطناعي</p>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalPosts">0</div>
                    <div class="stat-label">إجمالي المنشورات</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="lastUpdate">-</div>
                    <div class="stat-label">آخر تحديث</div>
                </div>
            </div>
        </header>
        
        <div id="postsContainer">
            <div class="loading">⏳ جاري تحميل المنشورات...</div>
        </div>
    </div>

    <script>
        const TYPE_LABELS = {
            'random': '🎲 عشوائي',
            'book_summary': '📚 ملخص كتاب',
            'article': '📝 مقال',
            'story': '📖 قصة',
            'facts': '💡 حقائق',
            'tips': '🎯 نصائح',
            'news': '📰 خبر تقني',
            'philosophy': '🤔 فلسفة',
            'history': '🏛️ تاريخ',
            'science': '🔬 علوم',
            'psychology': '🧠 علم نفس'
        };
        
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            
            try {
                // إضافة timestamp لمنع الكاش
                const response = await fetch('posts.json?t=' + Date.now());
                
                if (!response.ok) {
                    throw new Error('فشل تحميل المنشورات');
                }
                
                const posts = await response.json();
                
                // تحديث الإحصائيات
                document.getElementById('totalPosts').textContent = posts.length;
                if (posts.length > 0) {
                    document.getElementById('lastUpdate').textContent = posts[0].date.split(' ')[0];
                }
                
                if (posts.length === 0) {
                    container.innerHTML = '<div class="empty">📭 لا توجد منشورات بعد</div>';
                    return;
                }
                
                // عرض المنشورات
                container.innerHTML = posts.map(post => `
                    <div class="post-card">
                        <div class="post-header">
                            <span class="post-type">${TYPE_LABELS[post.type] || post.type}</span>
                            <span class="post-date">📅 ${post.date}</span>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-content">${post.content}</p>
                        ${post.url && post.url !== '#' ? `<a href="${post.url}" class="post-link" target="_blank">عرض التفاصيل ←</a>` : ''}
                    </div>
                `).join('');
                
            } catch (error) {
                container.innerHTML = `<div class="error">❌ خطأ: ${error.message}</div>`;
            }
        }
        
        // تحميل المنشورات عند فتح الصفحة
        loadPosts();
        
        // تحديث تلقائي كل 5 دقائق
        setInterval(loadPosts, 5 * 60 * 1000);
    </script>
</body>
</html>
