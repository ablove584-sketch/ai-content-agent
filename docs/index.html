<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alkinani</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: white;
            --text: #333;
            --text-secondary: #666;
            --border: #e0e0e0;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        [data-theme="dark"] {
            --card-bg: #1e1e2e;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: #333;
            --shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            transition: all 0.3s;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Top Bar - Last Update */
        .top-bar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            color: white;
            font-size: 12px;
        }
        
        .top-bar time {
            font-weight: 600;
        }
        
        /* Header */
        header {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            animation: slideDown 0.5s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Category Stats Bar */
        .category-bar {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            animation: slideDown 0.5s ease 0.1s both;
        }
        
        .category-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .category-item {
            background: linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .category-item:hover, .category-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            transform: translateY(-3px);
            border-color: transparent;
        }
        
        .category-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .category-count {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .category-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--card-bg);
            color: var(--primary);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .theme-toggle:hover { 
            transform: rotate(180deg) scale(1.1);
        }
        
        /* Search & Filter */
        .controls {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            animation: slideDown 0.5s ease 0.2s both;
        }
        
        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            background: var(--card-bg);
            color: var(--text);
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Posts */
        .post-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }
        
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .post-type {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .post-date {
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        .post-title {
            color: var(--text);
            font-size: 22px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .post-content {
            color: var(--text-secondary);
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 15px;
        }
        
        .post-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 8px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .action-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }
        
        /* Loading & Empty */
        .loading, .empty, .error {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: var(--shadow);
            color: var(--text);
        }
        
        .loading { color: var(--primary); }
        .error { background: #f8d7da; color: #721c24; }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: white;
            opacity: 0.8;
            font-size: 14px;
            margin-top: 30px;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .logo { font-size: 36px; letter-spacing: 4px; }
            .post-title { font-size: 18px; }
            .category-count { font-size: 20px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="تغيير الوضع">🌙</button>
    
    <div class="container">
        <div class="top-bar">
            <span>🕐 آخر تحديث: </span>
            <time id="lastUpdateTime">-</time>
        </div>
        
        <header>
            <div class="logo">alkinani</div>
            <p class="subtitle">
                منصة محتوى متنوعة تُنشَر تلقائيًا باستخدام الذكاء الاصطناعي<br>
                مقالات • ملخصات • قصص • حقائق • نصائح • والمزيد
            </p>
        </header>
        
        <div class="category-bar">
            <div class="category-stats" id="categoryStats">
                <div class="category-item" data-type="all" onclick="selectCategory('all')">
                    <div class="category-icon">📊</div>
                    <div class="category-count" id="totalCount">0</div>
                    <div class="category-label">إجمالي المنشورات</div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 ابحث في المنشورات...">
            <div class="filters" id="filtersContainer">
                <button class="filter-btn active" data-type="all">الكل</button>
            </div>
        </div>
        
        <div id="postsContainer">
            <div class="loading">⏳ جاري تحميل المنشورات...</div>
        </div>
        
        <footer>
            <p>منصة آلية · مدعومة بالذكاء الاصطناعي · GitHub Actions + Gemini API</p>
        </footer>
    </div>

    <script>
        const TYPE_LABELS = {
            'random': '🎲 عشوائي',
            'book_summary': '📚 ملخص كتاب',
            'article': ' مقال',
            'story': ' قصة',
            'facts': '💡 حقائق',
            'tips': '🎯 نصائح',
            'news': '📰 خبر تقني',
            'philosophy': ' فلسفة',
            'history': '🏛️ تاريخ',
            'science': '🔬 علوم',
            'psychology': '🧠 علم نفس'
        };
        
        const TYPE_ICONS = {
            'random': '🎲',
            'book_summary': '📚',
            'article': '',
            'story': '📖',
            'facts': '💡',
            'tips': '🎯',
            'news': '📰',
            'philosophy': '🤔',
            'history': '️',
            'science': '',
            'psychology': ''
        };
        
        let allPosts = [];
        let currentFilter = 'all';
        let currentSearch = '';
        
        // Theme
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.querySelector('.theme-toggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '️';
                localStorage.setItem('theme', 'dark');
            }
        }
        
        // Load saved theme
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('.theme-toggle').textContent = '☀️';
        }
        
        // Update last update time
        function updateLastUpdateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('ar-SA', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('lastUpdateTime').textContent = timeString;
        }
        
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            
            try {
                const response = await fetch('posts.json?t=' + Date.now());
                if (!response.ok) throw new Error('فشل التحميل');
                
                allPosts = await response.json();
                
                // Update stats
                updateStats();
                
                // Update last update time
                updateLastUpdateTime();
                
                // Build filters and categories
                buildFilters();
                buildCategoryStats();
                
                // Display posts
                displayPosts();
                
            } catch (error) {
                container.innerHTML = `<div class="error">❌ خطأ: ${error.message}</div>`;
            }
        }
        
        function updateStats() {
            document.getElementById('totalCount').textContent = allPosts.length;
        }
        
        function buildCategoryStats() {
            const types = [...new Set(allPosts.map(p => p.type))];
            const container = document.getElementById('categoryStats');
            
            // Keep the total count item
            let html = `
                <div class="category-item" data-type="all" onclick="selectCategory('all')">
                    <div class="category-icon">📊</div>
                    <div class="category-count" id="totalCount">${allPosts.length}</div>
                    <div class="category-label">إجمالي المنشورات</div>
                </div>
            `;
            
            types.forEach(type => {
                const count = allPosts.filter(p => p.type === type).length;
                const icon = TYPE_ICONS[type] || '📄';
                const label = TYPE_LABELS[type] || type;
                
                html += `
                    <div class="category-item" data-type="${type}" onclick="selectCategory('${type}')">
                        <div class="category-icon">${icon}</div>
                        <div class="category-count">${count}</div>
                        <div class="category-label">${label}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function buildFilters() {
            const types = [...new Set(allPosts.map(p => p.type))];
            const container = document.getElementById('filtersContainer');
            container.innerHTML = '<button class="filter-btn active" data-type="all">الكل</button>';
            
            types.forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.type = type;
                btn.textContent = TYPE_LABELS[type] || type;
                btn.onclick = () => selectCategory(type);
                container.appendChild(btn);
            });
            
            // Re-attach all button
            container.querySelector('[data-type="all"]').onclick = () => selectCategory('all');
        }
        
        function selectCategory(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn, .category-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            displayPosts();
        }
        
        function displayPosts() {
            const container = document.getElementById('postsContainer');
            
            let filtered = allPosts;
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.type === currentFilter);
            }
            
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                filtered = filtered.filter(p => 
                    (p.title && p.title.toLowerCase().includes(search)) ||
                    (p.content && p.content.toLowerCase().includes(search))
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">📭 لا توجد منشورات</div>';
                return;
            }
            
            container.innerHTML = filtered.map((post, i) => `
                <div class="post-card" style="animation-delay: ${i * 0.1}s">
                    <div class="post-header">
                        <span class="post-type">${TYPE_LABELS[post.type] || post.type}</span>
                        <span class="post-date">🕐 ${post.date}</span>
                    </div>
                    <h2 class="post-title">${post.title || 'بدون عنوان'}</h2>
                    <p class="post-content">${(post.content || '').substring(0, 300)}${(post.content || '').length > 300 ? '...' : ''}</p>
                    <div class="post-actions">
                        ${post.url && post.url !== '#' ? `<a href="${post.url}" class="action-btn" target="_blank">🔗 التفاصيل</a>` : ''}
                        <button class="action-btn" onclick="sharePost('${post.title}', '${(post.content || '').substring(0, 100)}')">📤 مشاركة</button>
                    </div>
                </div>
            `).join('');
        }
        
        function sharePost(title, content) {
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: content,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(`${title}\n\n${content}\n\n${window.location.href}`);
                alert('✅ تم نسخ المنشور!');
            }
        }
        
        // Search
        document.getElementById('searchBox').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            displayPosts();
        });
        
        // Load
        loadPosts();
        setInterval(loadPosts, 5 * 60 * 1000);
        setInterval(updateLastUpdateTime, 1000); // Update time every second
    </script>
</body>
</html>
