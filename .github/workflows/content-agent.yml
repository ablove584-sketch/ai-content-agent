name: AI Content Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'نوع المحتوى'
        required: false
        default: 'random'
        type: choice
        options:
          - random
          - book_summary
          - article
          - story
          - facts
          - tips
          - news
          - philosophy
          - history
          - science
          - psychology
      book_name:
        description: 'اسم الكتاب'
        required: false
        default: ''
        type: string
      custom_topic:
        description: 'موضوع مخصص'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-content-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Content Agent
        id: run-agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type || 'random' }}
          BOOK_NAME: ${{ github.event.inputs.book_name || '' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
          SAVE_TO_JSON: 'true'
        run: |
          python main.py
          echo "workflow_id=${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

      - name: Save post to JSON
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from datetime import datetime
          
          posts_file = 'docs/posts.json'
          
          # تحميل المنشورات الموجودة
          if os.path.exists(posts_file):
              try:
                  with open(posts_file, 'r', encoding='utf-8') as f:
                      posts = json.load(f)
              except:
                  posts = []
          else:
              posts = []
          
          # قراءة البيانات من البيئة
          content_type = os.getenv("CONTENT_TYPE", "random")
          workflow_id = os.getenv("WORKFLOW_ID", "unknown")
          
          # قراءة المنشور من قاعدة البيانات
          db_path = 'data/content.db'
          title = "منشور جديد"
          content = "تم إنشاء محتوى جديد بنجاح"
          topic = ""
          angle = ""
          core_idea = ""
          keywords = []
          hashtags = []
          
          if os.path.exists(db_path):
              import sqlite3
              conn = sqlite3.connect(db_path)
              conn.row_factory = sqlite3.Row
              cursor = conn.cursor()
              
              # جلب آخر منشور
              cursor.execute('''
                  SELECT title, content, topic, angle, core_idea, keywords, hashtags 
                  FROM posts 
                  ORDER BY id DESC 
                  LIMIT 1
              ''')
              
              row = cursor.fetchone()
              if row:
                  title = row['title'] or title
                  content = row['content'] or content
                  topic = row['topic'] or topic
                  angle = row['angle'] or angle
                  core_idea = row['core_idea'] or core_idea
                  
                  # إصلاح: التحقق من النص الفارغ قبل json.loads
                  if row['keywords'] and row['keywords'].strip():
                      try:
                          keywords = json.loads(row['keywords'])
                      except:
                          keywords = []
                  else:
                      keywords = []
                  
                  if row['hashtags'] and row['hashtags'].strip():
                      try:
                          hashtags = json.loads(row['hashtags'])
                      except:
                          hashtags = []
                  else:
                      hashtags = []
              
              conn.close()
          
          # إنشاء منشور جديد
          new_post = {
              "id": len(posts) + 1,
              "title": title,
              "content": content,
              "topic": topic,
              "angle": angle,
              "core_idea": core_idea,
              "keywords": keywords,
              "hashtags": hashtags,
              "type": content_type,
              "date": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              "url": f"https://github.com/{os.getenv('GITHUB_REPOSITORY')}/actions/runs/{workflow_id}",
              "reading_time": max(1, len(content.split()) // 200)
          }
          
          # إضافة المنشور الجديد في البداية
          posts.insert(0, new_post)
          
          # حفظ آخر 50 منشور فقط
          posts = posts[:50]
          
          # التأكد من وجود مجلد docs
          os.makedirs('docs', exist_ok=True)
          
          # حفظ الملف
          with open(posts_file, 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          
          print(f"✅ Saved {len(posts)} posts to {posts_file}")
          print(f"Latest post title: {title}")
          print(f"Content length: {len(content)} characters")
          PYEOF
        env:
          WORKFLOW_ID: ${{ steps.run-agent.outputs.workflow_id }}

      - name: Commit and push posts.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "📝 Update posts with real content" && git push)
        continue-on-error: true

      - name: Upload database as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-database
          path: data/content.db
          retention-days: 7
          overwrite: true
